<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fluxo OS</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        :root {
            --accent: #00d2ff;
            --bg: #050a18;
            --card: rgba(255, 255, 255, 0.08);
            --border: rgba(255, 255, 255, 0.1);
            --text: #e0e6ed;
        }

        * {
            box-sizing: border-box;
            outline: none;
            transition: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            background-image: radial-gradient(circle at 50% 0%, #1a2a4a 0%, #050a18 70%);
            height: 100vh;
            overflow: hidden;
        }

        .hidden { display: none !important; }
        .glass { background: var(--card); backdrop-filter: blur(15px); border: 1px solid var(--border); border-radius: 20px; }
        
        .top-bar {
            position: fixed; top: 0; width: 100%; height: 40px; background: rgba(0, 0, 0, 0.6);
            display: flex; align-items: center; padding: 0 20px; font-size: 12px; z-index: 10000;
            justify-content: space-between; border-bottom: 1px solid var(--border); letter-spacing: 1px;
        }

        .main-app {
            display: grid; grid-template-columns: 80px 1fr 320px; height: calc(100vh - 40px);
            margin-top: 40px; padding: 20px; gap: 20px;
        }

        .sidebar { display: flex; flex-direction: column; align-items: center; padding: 20px 0; gap: 15px; }
        .nav-item { width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; cursor: pointer; border-radius: 15px; font-size: 18px; opacity: 0.4; color: white; }
        .nav-item.active { opacity: 1; background: var(--accent); color: #000; box-shadow: 0 0 20px var(--accent); }
        
        .content-scroll { overflow-y: auto; padding-right: 10px; height: 100%; }
        .app-iframe { width: 100%; height: 100%; border: none; border-radius: 15px; background: white; }
        
        .post { padding: 20px; margin-bottom: 20px; border: 1px solid var(--border); animation: slideUp 0.4s ease; }
        .avatar-circle { width: 45px; height: 45px; border-radius: 50%; border: 2px solid var(--accent); object-fit: cover; }
        .post-img { width: 100%; border-radius: 15px; margin-top: 15px; max-height: 400px; object-fit: cover; }
        .post-actions { margin-top: 15px; display: flex; gap: 15px; border-top: 1px solid var(--border); padding-top: 10px; }
        .action-btn { cursor: pointer; font-size: 13px; opacity: 0.6; }
        .action-btn:hover { opacity: 1; color: var(--accent); }

        /* Estilos do Email Workspace */
        .email-workspace { display: grid; grid-template-columns: 200px 1fr; gap: 15px; height: 500px; }
        .email-nav { display: flex; flex-direction: column; gap: 10px; border-right: 1px solid var(--border); padding-right: 15px; }
        .email-nav button { background: rgba(255,255,255,0.05); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 8px; text-align: left; cursor: pointer; }
        .email-nav button:hover, .email-nav button.active { background: var(--accent); color: black; font-weight: bold; }
        .email-view { overflow-y: auto; padding-left: 5px; display: flex; flex-direction: column; gap: 10px; }
        .email-item { padding: 15px; border-radius: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
        .email-item h4 { margin: 0 0 5px 0; color: var(--accent); }
        .email-item small { opacity: 0.6; display: block; margin-bottom: 8px; }

        .call-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); z-index: 100000; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .call-avatar { width: 130px; height: 130px; border-radius: 50%; border: 4px solid var(--accent); margin-bottom: 20px; box-shadow: 0 0 30px var(--accent); object-fit: cover; }
        .call-status { font-size: 14px; letter-spacing: 2px; color: var(--accent); margin-bottom: 40px; animation: pulse 1.5s infinite; }
        .call-actions { display: flex; gap: 30px; }
        .call-btn { width: 65px; height: 65px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 24px; cursor: pointer; }
        .btn-hangup { background: #ff3b30; color: white; border: none;}
        .btn-accept { background: #4cd964; color: white; border: none;}
        
        input, textarea, select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: white; margin-bottom: 10px; font-family: inherit;}
        .btn { background: var(--accent); color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
        .btn:hover { opacity: 0.9; box-shadow: 0 0 10px var(--accent); }
        
        #toaster { position: fixed; bottom: 25px; right: 25px; padding: 15px 30px; border-radius: 12px; background: var(--accent); color: #000; font-weight: 800; transform: translateY(150px); z-index: 99999; transition: 0.4s; }
        
        @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media(max-width:900px){
            .main-app { grid-template-columns: 60px 1fr 0px; padding: 10px; gap: 10px; }
            .sidebar { gap: 10px; padding: 10px 0; }
            .nav-item { width: 45px; height: 45px; font-size: 16px; }
            .top-bar { font-size: 11px; height: 35px; padding: 0 10px; }
            .email-workspace { grid-template-columns: 1fr; }
            .email-nav { border-right: none; border-bottom: 1px solid var(--border); padding-bottom: 10px; flex-direction: row; }
            aside { display: none; }
        }
    </style>
</head>
<body>

<div class="top-bar">
    <div><i class="fa fa-bolt"></i> <b>Fluxo OS</b></div>
    <div id="os-clock">00:00:00</div>
    <div><i class="fa fa-microchip"></i></div>
</div>

<div id="auth-screen" style="position:fixed;inset:0;background:var(--bg);z-index:8000;display:flex;align-items:center;justify-content:center;">
    <div class="glass" style="width:350px;padding:30px;text-align:center;">
        <h1 style="letter-spacing:8px;color:var(--accent); margin-bottom: 25px;">FLUXO OS</h1>
        
        <div id="emailStep">
            <input type="email" id="userEmail" placeholder="Teu E-mail Corporativo">
            <button class="btn" style="width:100%;margin-top:10px;" onclick="checkEmailAuth()">AVANÇAR</button>
        </div>

        <div id="firstTimeFields" class="hidden">
            <p style="font-size: 12px; opacity:0.7;">Não encontramos este email. Regista-te abaixo:</p>
            <div style="margin:20px 0;cursor:pointer;" onclick="document.getElementById('avatarInput').click()">
                <img id="avatarPreview" src="https://ui-avatars.com/api/?background=00d2ff&color=000&name=?" style="width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);object-fit:cover;">
            </div>
            <input type="file" id="avatarInput" class="hidden" accept="image/*">
            <input type="text" id="username" placeholder="Teu Nome">
            <button class="btn" style="width:100%;margin-top:15px;" onclick="handleRegister()">CRIAR CONTA & ENTRAR</button>
        </div>
    </div>
</div>

<div id="app" class="main-app hidden">
    <nav class="sidebar glass">
        <div class="nav-item active" title="Feed" onclick="switchTab('feed',this)"><i class="fa-solid fa-house"></i></div>
        <div class="nav-item" title="Sistema de Email" onclick="switchTab('email',this)"><i class="fa-solid fa-envelope"></i></div>
        <div class="nav-item" title="Gaming Space" onclick="switchTab('gaming',this)"><i class="fa-solid fa-gamepad"></i></div>
        <div class="nav-item" title="Ferramentas" onclick="switchTab('tools',this)"><i class="fa-solid fa-screwdriver-wrench"></i></div>
        <div class="nav-item" title="Galeria" onclick="switchTab('gallery',this)"><i class="fa-solid fa-box-archive"></i></div>
        <div class="nav-item" title="Definições" onclick="switchTab('settings',this)"><i class="fa-solid fa-gear"></i></div>
        <div class="nav-item" onclick="logout()" style="margin-top:auto; color: #ff3b30;"><i class="fa-solid fa-power-off"></i></div>
    </nav>

    <main class="content-scroll" id="main-container">
        <section id="tab-feed">
            <div class="glass" style="padding:15px;margin-bottom:20px;">
                <textarea id="postTxt" rows="2" placeholder="O que estás a pensar?"></textarea>
                <div style="display:flex;justify-content:space-between; align-items:center;">
                    <label style="cursor:pointer;color:var(--accent);font-size:13px"><i class="fa fa-image"></i> Média <input type="file" id="postImgInput" class="hidden" accept="image/*"></label>
                    <button class="btn" onclick="publishPost()">POST</button>
                </div>
            </div>
            <div id="feedArea"></div>
        </section>

        <section id="tab-email" class="hidden">
            <h2 style="color: var(--accent); margin-top: 0;"><i class="fa-solid fa-envelope"></i> FluxoMail Workspace</h2>
            <div class="glass style="padding:15px;" class="email-workspace" style="padding: 20px;">
                <div class="email-nav">
                    <button id="btn-inbox" class="active" onclick="switchEmailSubTab('inbox')"><i class="fa fa-inbox"></i> Entrada</button>
                    <button id="btn-compose" onclick="switchEmailSubTab('compose')"><i class="fa fa-pen"></i> Escrever</button>
                </div>
                
                <div class="email-view">
                    <div id="email-inbox-view">
                        <div id="inboxList"></div>
                    </div>
                    
                    <div id="email-compose-view" class="hidden">
                        <input type="email" id="emailDest" placeholder="Para (email@exemplo.com)">
                        <input type="text" id="emailSubject" placeholder="Assunto">
                        <textarea id="emailMessage" rows="6" placeholder="Escreve a tua mensagem aqui..."></textarea>
                        <button class="btn" onclick="sendEmail()"><i class="fa fa-paper-plane"></i> Enviar Email</button>
                    </div>
                </div>
            </div>
        </section>

        <section id="tab-gaming" class="hidden" style="height:100%;">
            <iframe src="https://lucascoto98.github.io/Gaming-Space/" class="app-iframe"></iframe>
        </section>

        <section id="tab-tools" class="hidden" style="height:100%;">
            <iframe src="https://lucascoto98.github.io/Ferramentas/" class="app-iframe"></iframe>
        </section>

        <section id="tab-gallery" class="hidden">
            <h2>O Teu Vault</h2>
            <div id="galleryArea" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;"></div>
        </section>

        <section id="tab-settings" class="hidden">
            <h2>Definições de Perfil</h2>
            <div class="glass" style="padding:20px;text-align:center;">
                <div style="width:90px;height:90px;margin:0 auto 10px;cursor:pointer;" onclick="document.getElementById('editAvatarInput').click()">
                    <img id="editAvatarPreview" style="width:100%;height:100%;border-radius:50%;border:3px solid var(--accent);object-fit:cover;">
                    <input type="file" id="editAvatarInput" class="hidden">
                </div>
                <input type="text" id="editUsername" placeholder="Nome">
                <button class="btn" style="width:100%" onclick="updateProfile()">GUARDAR ALTERAÇÕES</button>
            </div>
        </section>
    </main>

    <aside>
        <div class="glass" style="padding:15px;text-align:center;margin-bottom:15px;">
            <img id="myAvatarSide" class="avatar-circle" style="width:60px;height:60px;" src="">
            <h3 id="myNameSide" style="margin:10px 0 0 0;"></h3>
            <small id="myEmailSide" style="opacity:0.5"></small>
        </div>
        <div class="glass" style="padding:15px;">
            <b style="font-size:11px;color:var(--accent)">UTILIZADORES DO SISTEMA</b>
            <div id="contactsArea" style="margin-top:10px;display:flex;flex-direction:column;gap:8px;"></div>
        </div>
    </aside>
</div>

<div id="call-screen" class="call-overlay hidden">
    <img id="call-img" src="" class="call-avatar">
    <h2 id="call-name">...</h2>
    <p id="call-status" class="call-status">SINALIZANDO...</p>
    <div class="call-actions">
        <button id="btn-accept-call" class="call-btn btn-accept hidden" onclick="acceptCall()"><i class="fa fa-phone"></i></button>
        <button class="call-btn btn-hangup" onclick="endCall()"><i class="fa fa-phone-slash"></i></button>
    </div>
    <audio id="ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3"></audio>
    <audio id="remote-audio" autoplay></audio>
</div>

<div id="toaster"></div>

<script>
// --- VARIÁVEIS GLOBAIS ---
let currentUser = null;
let posts = JSON.parse(localStorage.getItem('fl_posts')) || [];
let emails = JSON.parse(localStorage.getItem('fl_emails')) || [];
let peer, currentCall;

// Relógio do Sistema
setInterval(() => { document.getElementById('os-clock').innerText = new Date().toLocaleTimeString() }, 1000);

// Notificações Toast
function toast(m) {
    const t = document.getElementById('toaster');
    t.innerText = m;
    t.style.transform = "translateY(0)";
    setTimeout(() => t.style.transform = "translateY(150px)", 3000);
}

// --- FLUXO DE AUTENTICAÇÃO (LOGIN MELHORADO) ---
let currentCheckingEmail = "";

function checkEmailAuth() {
    const email = document.getElementById('userEmail').value.trim().toLowerCase();
    if (!email || !email.includes('@')) return toast("Insere um email válido!");
    
    currentCheckingEmail = email;
    const stored = localStorage.getItem('u_' + email);
    
    if (stored) {
        login(JSON.parse(stored));
    } else {
        document.getElementById('emailStep').classList.add('hidden');
        document.getElementById('firstTimeFields').classList.remove('hidden');
        document.getElementById('avatarPreview').src = `https://ui-avatars.com/api/?background=00d2ff&color=000&name=${email.substring(0,2)}`;
    }
}

function handleRegister() {
    const nome = document.getElementById('username').value.trim();
    if (!nome) return toast("Insere o teu nome!");
    
    const u = {
        email: currentCheckingEmail,
        nome: nome,
        foto: document.getElementById('avatarPreview').src
    };
    
    localStorage.setItem('u_' + currentCheckingEmail, JSON.stringify(u));
    
    // Guardar na lista global de e-mails registados para sugestão de contactos
    let globalUsers = JSON.parse(localStorage.getItem('fl_global_users')) || [];
    if(!globalUsers.find(user => user.email === u.email)) {
        globalUsers.push(u);
        localStorage.setItem('fl_global_users', JSON.stringify(globalUsers));
    }

    login(u);
}

function login(u) {
    currentUser = u;
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    
    updateUI();
    renderPosts();
    renderContacts();
    renderEmails();
    
    // Iniciar Ligação Peer P2P
    const peerId = 'fluxo-' + currentUser.email.replace(/[^a-zA-Z0-9]/g, '');
    peer = new Peer(peerId);
    peer.on('call', call => { currentCall = call; showIncomingCall(call.peer); });
    
    toast(`BEM-VINDO, ${currentUser.nome.toUpperCase()}`);
}

function logout() {
    localStorage.removeItem('current_session');
    location.reload();
}

// --- SISTEMA DE EMAIL (FLUXOMAIL) ---
function switchEmailSubTab(type) {
    document.getElementById('btn-inbox').classList.toggle('active', type === 'inbox');
    document.getElementById('btn-compose').classList.toggle('active', type === 'compose');
    
    document.getElementById('email-inbox-view').classList.toggle('hidden', type !== 'inbox');
    document.getElementById('email-compose-view').classList.toggle('hidden', type !== 'compose');
}

function sendEmail() {
    const dest = document.getElementById('emailDest').value.trim().toLowerCase();
    const subject = document.getElementById('emailSubject').value.trim();
    const msg = document.getElementById('emailMessage').value.trim();
    
    if (!dest || !subject || !msg) return toast("Preenche todos os campos do email!");
    
    const newEmail = {
        id: Date.now(),
        from: currentUser.email,
        fromName: currentUser.nome,
        to: dest,
        subject: subject,
        message: msg,
        date: new Date().toLocaleString()
    };
    
    emails.push(newEmail);
    localStorage.setItem('fl_emails', JSON.stringify(emails));
    
    toast("Email enviado com sucesso!");
    
    // Reset inputs
    document.getElementById('emailDest').value = '';
    document.getElementById('emailSubject').value = '';
    document.getElementById('emailMessage').value = '';
    
    switchEmailSubTab('inbox');
    renderEmails();
}

function renderEmails() {
    const area = document.getElementById('inboxList');
    if (!area) return;
    
    // Filtrar emails enviados para o utilizador atual
    const myInbox = emails.filter(e => e.to === currentUser.email);
    
    if (myInbox.length === 0) {
        area.innerHTML = `<p style="opacity: 0.5; text-align: center; margin-top: 20px;">A tua caixa de entrada está vazia.</p>`;
        return;
    }
    
    area.innerHTML = myInbox.reverse().map(e => `
        <div class="email-item">
            <h4>${escapeHTML(e.subject)}</h4>
            <small><b>De:</b> ${escapeHTML(e.fromName)} (${escapeHTML(e.from)}) | <b>Em:</b> ${e.date}</small>
            <p style="margin: 0; white-space: pre-wrap; font-size: 13px;">${escapeHTML(e.message)}</p>
        </div>
    `).join('');
}

function escapeHTML(str) {
    return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
    );
}

// --- INTERFACE GLOBAL ---
function updateUI() {
    document.getElementById('myNameSide').innerText = currentUser.nome;
    document.getElementById('myEmailSide').innerText = currentUser.email;
    document.getElementById('myAvatarSide').src = currentUser.foto;
    document.getElementById('editUsername').value = currentUser.nome;
    document.getElementById('editAvatarPreview').src = currentUser.foto;
}

function switchTab(t, el) {
    const sections = ['feed', 'email', 'gaming', 'tools', 'gallery', 'settings'];
    sections.forEach(s => { 
        const target = document.getElementById('tab-' + s); 
        if (target) target.classList.add('hidden'); 
    });
    
    document.getElementById('tab-' + t).classList.remove('hidden');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    el.classList.add('active');
    
    if (t === 'gallery') renderGallery();
    if (t === 'email') renderEmails();
    
    const container = document.getElementById('main-container');
    container.style.overflow = (t === 'gaming' || t === 'tools') ? "hidden" : "auto";
}

// --- CONTROLO DOS POSTS E FEED ---
function compressImage(file, callback) {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = event => {
        const img = new Image(); img.src = event.target.result; img.onload = () => {
            const canvas = document.createElement('canvas'); const MAX_WIDTH = 800; let width = img.width; let height = img.height;
            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
            canvas.width = width; canvas.height = height; const ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0, width, height); callback(canvas.toDataURL('image/jpeg', 0.7));
        };
    };
}

function publishPost() {
    const txtArea = document.getElementById('postTxt'); const fileInput = document.getElementById('postImgInput'); const txt = txtArea.value.trim(); const file = fileInput.files[0];
    if (!txt && !file) return;
    
    const finalSave = (imgData = null) => {
        const newPost = { id: Date.now(), u: currentUser.nome, e: currentUser.email, t: txt, f: currentUser.foto, i: imgData, likes: 0 };
        try { 
            posts.unshift(newPost); localStorage.setItem('fl_posts', JSON.stringify(posts)); txtArea.value = ""; fileInput.value = ""; renderPosts(); renderContacts(); toast("POST PUBLICADO!"); 
        } catch (e) { 
            toast("Erro ao publicar. Reduzi o tamanho do ficheiro."); 
        }
    };
    if (file) compressImage(file, finalSave); else finalSave();
}

function renderPosts() {
    const area = document.getElementById('feedArea'); if (!area) return;
    area.innerHTML = posts.map(p => `
        <div class="glass post">
            <div style="display:flex;align-items:center;gap:10px;">
                <img src="${p.f}" class="avatar-circle" style="width:35px;height:35px">
                <b>${escapeHTML(p.u)}</b>
            </div>
            ${p.t ? `<p style="margin:15px 0">${escapeHTML(p.t)}</p>` : ''}
            ${p.i ? `<img src="${p.i}" class="post-img">` : ''}
            <div class="post-actions">
                <span class="action-btn" onclick="likePost(${p.id})"><i class="fa fa-heart"></i> ${p.likes}</span>
            </div>
        </div>
    `).join('');
}

function likePost(id) { 
    const p = posts.find(p => p.id === id); 
    if (p) { p.likes++; localStorage.setItem('fl_posts', JSON.stringify(posts)); renderPosts(); } 
}

// --- LISTA DE CONTACTOS ATIVOS ---
function renderContacts() {
    const cA = document.getElementById('contactsArea'); cA.innerHTML = '';
    let globalUsers = JSON.parse(localStorage.getItem('fl_global_users')) || [];
    
    if(globalUsers.length <= 1) {
        cA.innerHTML = `<small style="opacity: 0.5;">Apenas tu estás no sistema.</small>`;
    }

    globalUsers.forEach(u => {
        if (u.email !== currentUser.email) {
            const div = document.createElement('div'); div.className = 'glass'; div.style.padding = '8px'; div.style.cursor = 'pointer'; div.style.display = 'flex'; div.style.gap = '10px'; div.style.alignItems = 'center';
            div.innerHTML = `<img src="${u.foto}" class="avatar-circle" style="width:25px;height:25px;"> <div><b>${escapeHTML(u.nome)}</b><br><small style="opacity:0.5">${escapeHTML(u.email)}</small></div>`;
            div.onclick = () => {
                switchTab('email', document.querySelector('[title="Sistema de Email"]'));
                switchEmailSubTab('compose');
                document.getElementById('emailDest').value = u.email;
            }; 
            cA.appendChild(div);
        }
    });
}

// --- CHAMADAS P2P (PEERJS) ---
function startCall(destId) {
    if (!peer) return toast("Erro de ligação");
    currentCall = peer.call('fluxo-' + destId, new MediaStream());
    showCallScreen(destId, true);
}

function showIncomingCall(peerId) {
    document.getElementById('call-img').src = "https://ui-avatars.com/api/?name=?&background=ff0&color=000";
    document.getElementById('call-name').innerText = peerId.replace('fluxo-', '');
    document.getElementById('btn-accept-call').classList.remove('hidden');
    document.getElementById('call-screen').classList.remove('hidden');
    document.getElementById('ringtone').play();
}

function acceptCall() { document.getElementById('ringtone').pause(); document.getElementById('btn-accept-call').classList.add('hidden'); }
function endCall() { document.getElementById('call-screen').classList.add('hidden'); document.getElementById('ringtone').pause(); }

// --- VAULT DA GALERIA ---
function renderGallery() {
    const area = document.getElementById('galleryArea'); area.innerHTML = '';
    posts.filter(p => p.i && p.e === currentUser.email).forEach(p => { 
        const img = document.createElement('img'); img.src = p.i; img.style.width = '100%'; img.style.borderRadius = '10px'; area.appendChild(img); 
    });
}

// --- CONTROLADORES DE AVATAR & PERFIL ---
document.getElementById('avatarInput').onchange = e => {
    if (e.target.files[0]) { const reader = new FileReader(); reader.onload = ev => document.getElementById('avatarPreview').src = ev.target.result; reader.readAsDataURL(e.target.files[0]); }
};
document.getElementById('editAvatarInput').onchange = e => {
    if (e.target.files[0]) { const reader = new FileReader(); reader.onload = ev => document.getElementById('editAvatarPreview').src = ev.target.result; reader.readAsDataURL(e.target.files[0]); }
};

function updateProfile() {
    currentUser.nome = document.getElementById('editUsername').value || currentUser.nome;
    currentUser.foto = document.getElementById('editAvatarPreview').src;
    localStorage.setItem('u_' + currentUser.email, JSON.stringify(currentUser));
    updateUI(); toast("Perfil Atualizado!");
}
</script>
