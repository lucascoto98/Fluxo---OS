<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fluxo OS Social P2P</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<style>
:root{
--accent:#00d2ff; --bg:#050a18; --card:rgba(255,255,255,0.08); --border:rgba(255,255,255,0.1); --text:#e0e6ed;
}
*{box-sizing:border-box;outline:none;}
body{
margin:0; font-family:'Inter',sans-serif; background:var(--bg); color:var(--text); overflow:hidden;
}
.glass{background:var(--card); backdrop-filter:blur(15px); border-radius:20px; border:1px solid var(--border);}
.hidden{display:none !important;}
.top-bar{position:fixed; top:0; width:100%; height:45px; display:flex; justify-content:space-between; align-items:center; padding:0 20px; font-size:12px; background:rgba(0,0,0,0.6); border-bottom:1px solid var(--border); z-index:1000;}
.main-app{display:grid; grid-template-columns:80px 1fr 300px; height:100vh; margin-top:45px; padding:15px; gap:15px;}
.sidebar{display:flex; flex-direction:column; align-items:center; padding:15px 0; gap:15px;}
.nav-item{width:50px;height:50px; display:flex; justify-content:center; align-items:center; border-radius:15px; opacity:0.5; color:white; font-size:18px; cursor:pointer; transition:0.3s;}
.nav-item.active{opacity:1; background:var(--accent); color:#000; box-shadow:0 0 20px var(--accent);}
.content-scroll{overflow-y:auto; height:100%; padding-right:10px;}
.app-iframe{width:100%; height:100%; border:none; border-radius:15px;}
.post{padding:15px; margin-bottom:15px; border:1px solid var(--border); animation:slideUp 0.4s ease; border-radius:15px;}
.avatar-circle{width:45px;height:45px;border-radius:50%;object-fit:cover;border:2px solid var(--accent);}
.post-img{width:100%; border-radius:15px; margin-top:10px; max-height:400px; object-fit:cover;}
.post-actions{margin-top:10px; display:flex; gap:10px; border-top:1px solid var(--border); padding-top:10px;}
.action-btn{cursor:pointer; font-size:13px; opacity:0.7;}
.action-btn:hover{opacity:1; color:var(--accent);}
.chat-container{display:flex; flex-direction:column; height:400px;}
.chat-messages{flex-grow:1; overflow-y:auto; display:flex; flex-direction:column; gap:8px; padding:10px;}
.bubble{max-width:75%; padding:10px 15px; border-radius:15px; font-size:13px;}
.bubble.sent{align-self:flex-end; background:var(--accent); color:#000;}
.bubble.received{align-self:flex-start; background:rgba(255,255,255,0.1);}
.call-overlay{position:fixed; inset:0; background:rgba(0,0,0,0.95); z-index:10000; display:flex; flex-direction:column; align-items:center; justify-content:center;}
.call-avatar{width:120px;height:120px;border-radius:50%;border:4px solid var(--accent);margin-bottom:20px;object-fit:cover;}
.call-status{font-size:14px; color:var(--accent); margin-bottom:30px; animation:pulse 1.5s infinite; letter-spacing:1px;}
.call-actions{display:flex; gap:25px;}
.call-btn{width:60px;height:60px;border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:22px; cursor:pointer;}
.btn-hangup{background:#ff3b30;color:white;}
.btn-accept{background:#4cd964;color:white;}
input,textarea{width:100%; padding:10px; border-radius:10px; border:1px solid var(--border); background:rgba(0,0,0,0.3); color:white; margin-bottom:10px;}
.btn{background:var(--accent); color:#000; border:none; padding:10px 20px; border-radius:10px; font-weight:bold; cursor:pointer;}
#toaster{position:fixed; bottom:20px; right:20px; padding:12px 25px; border-radius:12px; background:var(--accent); color:#000; font-weight:800; transform:translateY(150px); z-index:9999; transition:0.4s;}
@keyframes pulse{0%,100%{opacity:0.4;}50%{opacity:1;}}
@keyframes slideUp{from{opacity:0; transform:translateY(20px);}to{opacity:1; transform:translateY(0);}}
@media(max-width:768px){.main-app{grid-template-columns:0 1fr 0; padding:10px;} .sidebar{display:none;} .top-bar{font-size:10px;} input,textarea{padding:8px;}}
</style>
</head>
<body>

<div class="top-bar"><div><i class="fa fa-bolt"></i> <b>FLUXO</b> CORE</div><div id="os-clock">00:00:00</div><div><i class="fa fa-microchip"></i> SOCIAL P2P</div></div>

<div id="auth-screen" style="position:fixed; inset:0; display:flex; justify-content:center; align-items:center; background:var(--bg); z-index:9000;">
<div class="glass" style="width:350px; padding:35px; text-align:center;">
<h1 style="letter-spacing:8px; color:var(--accent);">FLUXO</h1>
<input type="email" id="userEmail" placeholder="Teu E-mail">
<div id="firstTimeFields" class="hidden">
<div style="margin:20px 0; cursor:pointer;" onclick="document.getElementById('avatarInput').click()">
<img id="avatarPreview" src="https://ui-avatars.com/api/?background=00d2ff&color=000&name=?" style="width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);object-fit:cover;">
</div>
<input type="file" id="avatarInput" class="hidden" accept="image/*">
<input type="text" id="username" placeholder="Teu Nome">
</div>
<button class="btn" style="width:100%; margin-top:12px;" onclick="handleAuth()">ENTRAR</button>
</div>
</div>

<div id="app" class="main-app hidden">
<nav class="sidebar glass">
<div class="nav-item active" title="Feed" onclick="switchTab('feed',this)"><i class="fa-solid fa-house"></i></div>
<div class="nav-item" title="Messenger" onclick="switchTab('messenger',this)"><i class="fa-solid fa-paper-plane"></i></div>
<div class="nav-item" title="Gaming" onclick="switchTab('gaming',this)"><i class="fa-solid fa-gamepad"></i></div>
<div class="nav-item" title="Tools" onclick="switchTab('tools',this)"><i class="fa-solid fa-screwdriver-wrench"></i></div>
<div class="nav-item" title="Gallery" onclick="switchTab('gallery',this)"><i class="fa-solid fa-box-archive"></i></div>
<div class="nav-item" title="Settings" onclick="switchTab('settings',this)"><i class="fa-solid fa-gear"></i></div>
<div class="nav-item" onclick="location.reload()" style="margin-top:auto"><i class="fa-solid fa-power-off"></i></div>
</nav>

<main class="content-scroll" id="main-container">

<section id="tab-feed">
<div class="glass" style="padding:15px; margin-bottom:15px;">
<textarea id="postTxt" rows="2" placeholder="O que estás a pensar?"></textarea>
<div style="display:flex; justify-content:space-between; align-items:center;">
<label style="cursor:pointer; color:var(--accent); font-size:13px;"><i class="fa fa-image"></i> Media
<input type="file" id="postImgInput" class="hidden" accept="image/*"></label>
<button class="btn" onclick="publishPost()">POST</button>
</div>
</div>
<div id="feedArea"></div>
</section>

<section id="tab-messenger" class="hidden">
<div class="glass chat-container">
<div style="padding:10px; display:flex; justify-content:space-between; align-items:center;">
<input type="email" id="chatDest" placeholder="Para: email@exemplo.com" style="width:70%;">
<button class="btn" style="padding:6px;" onclick="startCall(document.getElementById('chatDest').value)"><i class="fa fa-phone"></i></button>
</div>
<div id="chatMessages" class="chat-messages"></div>
<div style="padding:10px; display:flex; gap:8px;">
<input type="text" id="chatInput" placeholder="Mensagem..." onkeypress="if(event.key==='Enter') sendChat()">
<button class="btn" onclick="sendChat()"><i class="fa fa-location-arrow"></i></button>
</div>
</div>
</section>

<section id="tab-gaming" class="hidden" style="height:100%;">
<iframe src="https://lucascoto98.github.io/Gaming-Space/" class="app-iframe"></iframe>
</section>

<section id="tab-tools" class="hidden" style="height:100%;">
<iframe src="https://lucascoto98.github.io/Ferramentas/" class="app-iframe"></iframe>
</section>

<section id="tab-gallery" class="hidden">
<h2>O Teu Vault</h2>
<div id="galleryArea" style="display:grid; grid-template-columns: repeat(3,1fr); gap:10px;"></div>
</section>

<section id="tab-settings" class="hidden">
<h2>Definições</h2>
<div class="glass" style="padding:20px; text-align:center;">
<div style="width:90px;height:90px;margin:0 auto 10px; cursor:pointer;" onclick="document.getElementById('editAvatarInput').click()">
<img id="editAvatarPreview" style="width:100%;height:100%;border-radius:50%;border:3px solid var(--accent);object-fit:cover;">
<input type="file" id="editAvatarInput" class="hidden">
</div>
<input type="text" id="editUsername" placeholder="Nome">
<button class="btn" style="width:100%;" onclick="updateProfile()">GUARDAR</button>
</div>
</section>

</main>

<aside>
<div class="glass" style="padding:15px; text-align:center; margin-bottom:15px;">
<img id="myAvatarSide" class="avatar-circle" style="width:70px;height:70px;">
<h3 id="myNameSide" style="margin:8px 0 0 0;"></h3>
<small id="myEmailSide" style="opacity:0.5"></small>
</div>
<div class="glass" style="padding:15px;">
<b style="font-size:11px;color:var(--accent);">CONTACTOS ATIVOS</b>
<div id="contactsArea" style="margin-top:10px; display:flex; flex-direction:column; gap:8px;"></div>
</div>
</aside>
</div>

<div id="call-screen" class="call-overlay hidden">
<img id="call-img" class="call-avatar" src="">
<h2 id="call-name">...</h2>
<p id="call-status" class="call-status">SINALIZANDO...</p>
<div class="call-actions">
<div id="btn-accept-call" class="call-btn btn-accept hidden" onclick="acceptCall()"><i class="fa fa-phone"></i></div>
<div class="call-btn btn-hangup" onclick="endCall()"><i class="fa fa-phone-slash"></i></div>
</div>
<audio id="ringtone" loop src="https://assets.mixkit.co/active_storage/sfx/1359/1359-preview.mp3"></audio>
<audio id="remote-audio" autoplay></audio>
</div>

<div id="toaster"></div>

<script>
let currentUser=null;
let posts=JSON.parse(localStorage.getItem('fl_posts'))||[];
let messages=JSON.parse(localStorage.getItem('fl_msgs'))||[];
let peer,currentCall;

setInterval(()=>{document.getElementById('os-clock').innerText=new Date().toLocaleTimeString();},1000);
function toast(m){const t=document.getElementById('toaster'); t.innerText=m; t.style.transform="translateY(0)"; setTimeout(()=>t.style.transform="translateY(150px)",3000);}

// ---------- AUTH ----------
function handleAuth(){
const email=document.getElementById('userEmail').value.trim().toLowerCase();
if(!email) return;
const stored=JSON.parse(localStorage.getItem('u_'+email));
if(stored) login(stored);
else{
const f=document.getElementById('firstTimeFields');
if(f.classList.contains('hidden')) f.classList.remove('hidden');
else{
const u={email, nome:document.getElementById('username').value||"User", foto:document.getElementById('avatarPreview').src};
localStorage.setItem('u_'+email,JSON.stringify(u));
login(u);
}
}
}

function login(u){
currentUser=u;
document.getElementById('auth-screen').classList.add('hidden');
document.getElementById('app').classList.remove('hidden');
updateUI(); renderPosts(); renderContacts();
peer=new Peer('fluxo-'+currentUser.email.replace(/[^a-zA-Z0-9]/g,''));
peer.on('call', call=>{currentCall=call; showIncomingCall(call.peer);});
peer.on('connection', conn=>{
conn.on('data', d=>{
if(d.type==='msg'){messages.push(d.msg); localStorage.setItem('fl_msgs',JSON.stringify(messages)); renderChat(d.msg.to); renderContacts();}
});
});
toast("SISTEMA ATIVO");
}

function updateUI(){
document.getElementById('myNameSide').innerText=currentUser.nome;
document.getElementById('myEmailSide').innerText=currentUser.email;
document.getElementById('myAvatarSide').src=currentUser.foto;
document.getElementById('editUsername').value=currentUser.nome;
document.getElementById('editAvatarPreview').src=currentUser.foto;
}

// ---------- TABS ----------
function switchTab(t,el){
document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
el.classList.add('active');
document.querySelectorAll('main > section').forEach(s=>s.classList.add('hidden'));
document.getElementById('tab-'+t).classList.remove('hidden');
if(t==='gallery') renderGallery();
}

// ---------- IMAGE COMPRESSION ----------
function compressImage(file,callback){
const reader=new FileReader();
reader.readAsDataURL(file);
reader.onload=ev=>{
const img=new Image(); img.src=ev.target.result;
img.onload=()=>{
const canvas=document.createElement('canvas');
const MAX=800; let w=img.width,h=img.height;
if(w>MAX){h*=MAX/w; w=MAX;}
canvas.width=w; canvas.height=h;
const ctx=canvas.getContext('2d'); ctx.drawImage(img,0,0,w,h);
callback(canvas.toDataURL('image/jpeg',0.7));
}
}
}

// ---------- POSTS ----------
function publishPost(){
const txt=document.getElementById('postTxt').value.trim();
const file=document.getElementById('postImgInput').files[0];
if(!txt&&!file) return;
const finalSave=(img=null)=>{
posts.unshift({id:Date.now(), u:currentUser.nome, e:currentUser.email, t:txt, f:currentUser.foto, i:img, likes:0});
localStorage.setItem('fl_posts',JSON.stringify(posts)); document.getElementById('postTxt').value=''; document.getElementById('postImgInput').value='';
renderPosts(); renderContacts(); toast("POST PUBLICADO!");
}
if(file) compressImage(file,finalSave); else finalSave();
}

function renderPosts(){
const area=document.getElementById('feedArea'); area.innerHTML='';
posts.forEach(p=>{
const div=document.createElement('div'); div.className='post glass';
div.innerHTML=`<div style="display:flex;align-items:center;gap:10px;">
<img class="avatar-circle" src="${p.f}"><b>${p.u}</b></div>
${p.t?`<p style="margin-top:10px;">${p.t}</p>`:''}
${p.i?`<img src="${p.i}" class="post-img">`:''}
<div class="post-actions">
<span class="action-btn" onclick="like(${p.id})"><i class="fa-solid fa-heart"></i> ${p.likes}</span>
<span class="action-btn" onclick="openChat('${p.e}')"><i class="fa-solid fa-comment"></i></span>
<span class="action-btn" onclick="startCall('${p.e}')"><i class="fa-solid fa-phone"></i></span>
</div>`;
area.appendChild(div);
});
area.scrollTop=0;
}

function like(id){
const p=posts.find(x=>x.id===id); if(p){p.likes++; localStorage.setItem('fl_posts',JSON.stringify(posts)); renderPosts();}
}

// ---------- CHAT ----------
function sendChat(){
const to=document.getElementById('chatDest').value.toLowerCase();
const txt=document.getElementById('chatInput').value.trim();
if(!to||!txt) return;
messages.push({from:currentUser.email,to,msg:txt});
localStorage.setItem('fl_msgs',JSON.stringify(messages));
renderChat(to); document.getElementById('chatInput').value='';
const conn=peer.connect('fluxo-'+to.replace(/[^a-zA-Z0-9]/g,''));
conn.on('open',()=>{conn.send({type:'msg',msg:{from:currentUser.email,to,msg:txt}});});
toast("Mensagem enviada!");
}

function renderChat(to){
const area=document.getElementById('chatMessages'); area.innerHTML='';
messages.filter(m=>m.from===to||m.to===to).forEach(m=>{
const b=document.createElement('div'); b.className='bubble '+(m.from===currentUser.email?'sent':'received'); b.innerText=m.msg; area.appendChild(b);
}); area.scrollTop=area.scrollHeight;
}

function openChat(email){switchTab('messenger',document.querySelector('[title="Messenger"]')); document.getElementById('chatDest').value=email; renderChat(email);}

// ---------- CALLS ----------
function startCall(to){const conn=peer.connect('fluxo-'+to.replace(/[^a-zA-Z0-9]/g,'')); navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{currentCall=peer.call('fluxo-'+to.replace(/[^a-zA-Z0-9]/g,''),stream); showOutgoingCall(to); currentCall.on('stream', s=>document.getElementById('remote-audio').srcObject=s);});}
function showIncomingCall(peerId){document.getElementById('call-screen').classList.remove('hidden'); document.getElementById('call-name').innerText=peerId; document.getElementById('btn-accept-call').classList.remove('hidden'); document.getElementById('ringtone').play();}
function showOutgoingCall(peerId){document.getElementById('call-screen').classList.remove('hidden'); document.getElementById('call-name').innerText=peerId; document.getElementById('btn-accept-call').classList.add('hidden'); document.getElementById('ringtone').play();}
function acceptCall(){navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{currentCall.answer(stream); currentCall.on('stream', s=>document.getElementById('remote-audio').srcObject=s);}); document.getElementById('ringtone').pause();}
function endCall(){if(currentCall) currentCall.close(); currentCall=null; document.getElementById('call-screen').classList.add('hidden'); document.getElementById('ringtone').pause();}

// ---------- GALLERY ----------
function renderGallery(){const area=document.getElementById('galleryArea'); area.innerHTML=''; posts.filter(p=>p.i).forEach(p=>{const img=document.createElement('img'); img.src=p.i; img.style.width='100%'; img.style.borderRadius='10px'; area.appendChild(img);});}

// ---------- SETTINGS ----------
document.getElementById('avatarInput').addEventListener('change',e=>{const r=new FileReader(); r.readAsDataURL(e.target.files[0]); r.onload=()=>document.getElementById('avatarPreview').src=r.result;});
document.getElementById('editAvatarInput').addEventListener('change',e=>{const r=new FileReader(); r.readAsDataURL(e.target.files[0]); r.onload=()=>document.getElementById('editAvatarPreview').src=r.result;});
function updateProfile(){currentUser.nome=document.getElementById('editUsername').value||currentUser.nome; currentUser.foto=document.getElementById('editAvatarPreview').src; localStorage.setItem('u_'+currentUser.email,JSON.stringify(currentUser)); updateUI(); toast("Perfil atualizado!");}

// ---------- CONTACTS ----------
function renderContacts(){const area=document.getElementById('contactsArea'); area.innerHTML=''; const unique=messages.map(m=>m.from).concat(messages.map(m=>m.to)).filter(x=>x!==currentUser.email); [...new Set(unique)].forEach(e=>{const div=document.createElement('div'); div.className='glass'; div.style.padding='8px'; div.style.cursor='pointer'; div.innerText=e; div.onclick=()=>openChat(e); area.appendChild(div);});}

</script>

</body>
</html>
